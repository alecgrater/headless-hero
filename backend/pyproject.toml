[project]
name = "headless-hero-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.52.0",
    "google-genai>=1.0.0",
    "fastapi>=0.124.4",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.1.0",
    "httpx>=0.28.1",
    "pydantic>=2.10.6",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.29",
    "uvicorn>=0.33.0",
    "Pillow>=11.0.0",
    "rembg[cpu]>=2.0.50",
    "pytrends>=4.9.0",
    "feedparser>=6.0.0",
    "newsapi-python>=0.2.7",
    "thefuzz[speedup]>=0.22.0",
    "yt-dlp>=2026.3.17",
    "faster-whisper>=1.1.0",
    "openai>=2.36.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
# Collect only the suite. `api/test_lab.py` and `pipeline/test_lab*.py` are
# production modules whose names match pytest's default `test_*.py` pattern, so
# an unscoped run imports them — and therefore `config` and `database` — before
# tests/conftest.py can point HH_DATA_DIR at a temp directory. That binds the
# developer's real data/db.sqlite (which stores plaintext API keys) for the
# whole session and runs create_all + the settings migrations against it.
testpaths = ["tests"]
