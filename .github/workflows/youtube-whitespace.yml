name: YouTube Whitespace Discovery

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Generate remote content profile and seed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run --project backend python scripts/remote_content_profile.py

      - name: Generate whitespace feed
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: uv run --project backend python scripts/youtube_whitespace.py

      - name: Commit discovery changes
        run: |
          if git diff --quiet -- discovery/content-profile-seed.json frontend/public/discovery/content-profile.json frontend/public/discovery/youtube-whitespace.json; then
            echo "No discovery changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discovery/content-profile-seed.json frontend/public/discovery/content-profile.json frontend/public/discovery/youtube-whitespace.json
          git commit -m "Update remote discovery artifacts"
          git push
