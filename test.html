<!DOCTYPE html>
<html>
<style>
.container { width: 100px; height: 100px; background: red; overflow: hidden; position: relative; }
.inner { width: 100px; height: 100px; background: blue; transform-origin: 0% 0%; transform: scale(1.1) translateX(5px); opacity: 0.5; }
</style>
<body>
<div class="container" id="c">
  <div class="inner" id="i"></div>
</div>
<script>
  const r = document.getElementById('i').getBoundingClientRect();
  const c = document.getElementById('c').getBoundingClientRect();
  console.log(r.left - c.left);
</script>
</body>
</html>
